apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'observer'
        static_configs:
          - targets: ['observer:9100']
      - job_name: 'bitcoind'
        static_configs:
          - targets: ['bitcoind:8332']

    # Alertmanager 연결
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    # Alert rules 파일
    rule_files:
      - /etc/prometheus/alerts.yml

  alerts.yml: |
    groups:
      - name: bitcoin-rpc-health
        rules:
        - alert: BitcoinRPCDown
          expr: blockchain_bitcoin_rpc_up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Bitcoin RPC is DOWN"
            description: "Bitcoin RPC endpoint has been unreachable for more than 1 minute."
      - name: bitcoin-rpc-latency
        rules:
        - alert: BitcoinRPCLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              rate(blockchain_bitcoin_rpc_latency_seconds_bucket[5m])
            ) > 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Bitcoin RPC latency is high
            description: 95th percentile latency has been over 1s for more than 1 minute.
